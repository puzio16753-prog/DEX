name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scanner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/scanner/package-lock.json
      - run: npm install
      - run: npm test
      - run: docker build -t dex-liquidity-scanner:ci .

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
