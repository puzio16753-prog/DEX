services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scanner
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: scanner
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner -d scanner"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  scanner:
    build:
      context: ./services/scanner
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://scanner:scanner@postgres:5432/scanner
      REDIS_URL: redis://redis:6379
      SCAN_INTERVAL_MS: "15000"
      CHAIN_ID: "1"
      SERVICE_NAME: dex-liquidity-scanner
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "node src/migrate.js && node src/index.js"]

volumes:
  postgres_data:
